<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3" />
      <stop offset="45%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9C7844" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Outer Architectural Diamond / Frame -->
  <rect x="12" y="12" width="76" height="76" rx="4" transform="rotate(45 50 50)" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
  
  <!-- Subtle Meridian Orbit Ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.45" />
  
  <!-- Central Axis 'I' (Column of Justice / Meridian) -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="20" r="3" fill="url(#goldLight)" />
  <circle cx="50" cy="80" r="3" fill="url(#goldLight)" />
  
  <!-- Geometric 'V' (Vector of Freedom / Borderless Shield) -->
  <path d="M26 34 L50 72 L74 34" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Accent Point in Center -->
  <circle cx="50" cy="50" r="3.5" fill="url(#goldGrad)" />
</svg>