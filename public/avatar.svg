<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141E2C" />
      <stop offset="70%" stop-color="#090D14" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#805F2F" />
    </linearGradient>
    <linearGradient id="goldEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F2DFB3" />
      <stop offset="60%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9C7844" />
    </linearGradient>
  </defs>
  
  <!-- Base Background Circle -->
  <circle cx="200" cy="200" r="198" fill="url(#bgGrad)" />
  
  <!-- Subtle Global Coordinates Grid (Discreet Law Without Borders Motif) -->
  <ellipse cx="200" cy="200" rx="160" ry="60" stroke="#C5A880" stroke-width="0.8" stroke-opacity="0.15" fill="none" />
  <ellipse cx="200" cy="200" rx="60" ry="160" stroke="#C5A880" stroke-width="0.8" stroke-opacity="0.15" fill="none" />
  <line x1="200" y1="30" x2="200" y2="370" stroke="#C5A880" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.2" />
  <line x1="30" y1="200" x2="370" y2="200" stroke="#C5A880" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.2" />
  
  <!-- Outer Gold Rim -->
  <circle cx="200" cy="200" r="185" stroke="url(#ringGrad)" stroke-width="3" />
  <circle cx="200" cy="200" r="176" stroke="url(#ringGrad)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.4" />
  
  <!-- Central Emblem Group -->
  <g transform="translate(100, 80) scale(2)">
    <rect x="12" y="12" width="76" height="76" rx="4" transform="rotate(45 50 50)" stroke="url(#goldEmblem)" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
    <circle cx="50" cy="50" r="32" stroke="url(#goldEmblem)" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.45" />
    <line x1="50" y1="18" x2="50" y2="82" stroke="url(#goldEmblem)" stroke-width="3.2" stroke-linecap="round" />
    <circle cx="50" cy="18" r="3" fill="#FFFFFF" />
    <circle cx="50" cy="82" r="3" fill="#FFFFFF" />
    <path d="M25 32 L50 74 L75 32" stroke="url(#goldEmblem)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="50" r="4" fill="url(#goldEmblem)" />
  </g>
  
  <!-- Bottom Text Curve / Badge -->
  <text x="200" y="325" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">V. I. LEVIN</text>
  <text x="200" y="342" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#C5A880" text-anchor="middle">LEGAL SOLUTIONS</text>
</svg>